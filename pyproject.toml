[project]
name = "racetrace-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["sdk/python", "examples/redis-worker"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "examples/redis-worker/tests"]

[tool.ruff]
target-version = "py311"
